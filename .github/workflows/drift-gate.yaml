name: Drift Gate

# Verifies that this framework repo mirrors the org-owned baseline files
# byte-for-byte against their canonical source. This repo does not derive from
# terraform-runner-template; framework-template conformance is enforced through
# the framework's own tests and workflow surface.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: drift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  org-baseline:
    name: org-baseline / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (org baseline)
        # renovate: datasource=github-tags depName=NWarila/drift-gate
        uses: NWarila/drift-gate@d835ae411f1e55e25b2b6c079d5891e7345a043c # main @ 2026-05-09
        with:
          source-repo: nwarila-platform/.github
          source-ref: 0d2a0752d4c618907d735af4a7c12a9214c8517e
          manifest: baseline-manifest.json
          check-name: org-baseline / verify
