name: Terraform Framework Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Validate & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Test (JSON)
        id: test_json
        run: terraform test -json > ../test-results.json 2>&1 || true

      - name: Terraform Test (Human)
        id: test_human
        run: terraform test -no-color 2>&1 | tee ../test-results.txt
        continue-on-error: true

      - name: Parse Test Results
        id: parse
        if: always()
        shell: bash
        run: |
          JSON_FILE="../test-results.json"
          HUMAN_FILE="../test-results.txt"

          if [ ! -f "$JSON_FILE" ]; then
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
            echo "result=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PASSED=$(grep -cE '^\s+run ".*"\.\.\. pass$' "$HUMAN_FILE" || true)
          FAILED=$(grep -cE '^\s+run ".*"\.\.\. fail$' "$HUMAN_FILE" || true)
          SKIPPED=$(grep -cE '^\s+run ".*"\.\.\. skip$' "$HUMAN_FILE" || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}
          TOTAL=$((PASSED + FAILED + SKIPPED))

          if [ "$FAILED" -gt 0 ]; then
            RESULT="failure"
          elif [ "$PASSED" -gt 0 ]; then
            RESULT="success"
          else
            RESULT="error"
          fi

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Job Summary
        if: always()
        shell: bash
        run: |
          HUMAN_FILE="../test-results.txt"
          {
            echo "## Terraform Framework Test Results"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Format | ${{ steps.fmt.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Init | ${{ steps.init.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Validate | ${{ steps.validate.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Test Suite | ${{ steps.test_human.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo ""
            echo "**Runs:** ${{ steps.parse.outputs.total }} total, ${{ steps.parse.outputs.passed }} passed, ${{ steps.parse.outputs.failed }} failed, ${{ steps.parse.outputs.skipped }} skipped"
            echo ""
            echo "<details>"
            echo "<summary>Full test output</summary>"
            echo ""
            echo '```'
            if [ -f "$HUMAN_FILE" ]; then
              cat "$HUMAN_FILE"
            else
              echo "No test output captured."
            fi
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const humanFile = 'test-results.txt';
            let testOutput = 'No test output captured.';
            if (fs.existsSync(humanFile)) {
              testOutput = fs.readFileSync(humanFile, 'utf8');
              if (testOutput.length > 60000) {
                testOutput = testOutput.substring(0, 60000) + '\n\n... (truncated)';
              }
            }

            const fmtStatus = '${{ steps.fmt.outcome }}' === 'success' ? '✅' : '❌';
            const initStatus = '${{ steps.init.outcome }}' === 'success' ? '✅' : '❌';
            const valStatus = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const testStatus = '${{ steps.test_human.outcome }}' === 'success' ? '✅' : '❌';
            const passed = '${{ steps.parse.outputs.passed }}';
            const failed = '${{ steps.parse.outputs.failed }}';
            const total = '${{ steps.parse.outputs.total }}';
            const skipped = '${{ steps.parse.outputs.skipped }}';

            const body = [
              '## Terraform Framework Test Results',
              '',
              '| Check | Status |',
              '|---|---|',
              `| Format | ${fmtStatus} |`,
              `| Init | ${initStatus} |`,
              `| Validate | ${valStatus} |`,
              `| Test Suite | ${testStatus} |`,
              '',
              `**Runs:** ${total} total, ${passed} passed, ${failed} failed, ${skipped} skipped`,
              '',
              '<details>',
              '<summary>Full test output</summary>',
              '',
              '```',
              testOutput,
              '```',
              '</details>',
              '',
              `_Commit: ${context.sha.substring(0, 8)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Framework Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-test-results
          path: |
            test-results.json
            test-results.txt
          retention-days: 90

      - name: Fail if tests failed
        if: steps.test_human.outcome == 'failure' || steps.fmt.outcome == 'failure'
        run: exit 1
