name: Terraform Framework Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Test (JSON)
        id: test_json
        run: terraform test -json > ../test-results.json 2>&1 || true

      - name: Terraform Test (Human)
        id: test_human
        run: terraform test -no-color 2>&1 | tee ../test-results.txt
        continue-on-error: true

      - name: Parse Test Results
        id: parse
        if: always()
        shell: bash
        run: |
          HUMAN_FILE="../test-results.txt"

          PASSED=$(grep -cE '^\s+run ".*"\.\.\. pass$' "$HUMAN_FILE" || true)
          FAILED=$(grep -cE '^\s+run ".*"\.\.\. fail$' "$HUMAN_FILE" || true)
          SKIPPED=$(grep -cE '^\s+run ".*"\.\.\. skip$' "$HUMAN_FILE" || true)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          SKIPPED=${SKIPPED:-0}
          TOTAL=$((PASSED + FAILED + SKIPPED))

          if [ "$FAILED" -gt 0 ]; then
            RESULT="failure"
          elif [ "$PASSED" -gt 0 ]; then
            RESULT="success"
          else
            RESULT="error"
          fi

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Job Summary
        if: always()
        shell: bash
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TEST_OUTCOME: ${{ steps.test_human.outcome }}
          TOTAL_RUNS: ${{ steps.parse.outputs.total }}
          PASSED_RUNS: ${{ steps.parse.outputs.passed }}
          FAILED_RUNS: ${{ steps.parse.outputs.failed }}
          SKIPPED_RUNS: ${{ steps.parse.outputs.skipped }}
        run: |
          HUMAN_FILE="../test-results.txt"
          status() {
            if [ "$1" = "success" ]; then
              printf "Pass"
            else
              printf "Fail"
            fi
          }

          {
            echo "## Terraform Framework Test Results"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Format | $(status "$FMT_OUTCOME") |"
            echo "| Init | $(status "$INIT_OUTCOME") |"
            echo "| Validate | $(status "$VALIDATE_OUTCOME") |"
            echo "| Test Suite | $(status "$TEST_OUTCOME") |"
            echo ""
            echo "**Runs:** ${TOTAL_RUNS} total, ${PASSED_RUNS} passed, ${FAILED_RUNS} failed, ${SKIPPED_RUNS} skipped"
            echo ""
            echo "<details>"
            echo "<summary>Full test output</summary>"
            echo ""
            echo '```'
            if [ -f "$HUMAN_FILE" ]; then
              cat "$HUMAN_FILE"
            else
              echo "No test output captured."
            fi
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-test-results
          path: |
            test-results.json
            test-results.txt
          retention-days: 90

      - name: Fail if tests failed
        if: steps.test_human.outcome == 'failure' || steps.fmt.outcome == 'failure'
        run: exit 1

  watchdog:
    name: Fleet watchdog tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The watchdog is the control that detects a required check silently
      # failing to report. If it regresses, nothing else in this repo notices --
      # it is the only thing watching for that failure mode, so it needs its own
      # gate rather than riding along on the terraform suite.
      - name: Unit tests
        working-directory: tools
        run: python3 -m unittest test_fleet_watchdog -v
