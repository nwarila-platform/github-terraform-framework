name: Reusable Terraform Deploy

# Deploys this framework against a runner repository's data. Called by the
# `*-runner` repos under any org.
#
# Deploy flow
# -----------
# 1. Optionally downloads private repo definitions from S3 via additive
#    `aws s3 sync` of the configured private-repo prefix. Matching YAML files
#    are copied into the runner's `terraform/private/` directory (additive;
#    pre-existing files in that directory are preserved).
# 2. Overlays the runner's `terraform/public/` and `terraform/private/` (now
#    containing both committed files and any S3-fetched files) onto the
#    framework's `terraform/repos/{public,private}/` tree.
# 3. On canonical-state writer runs only, imports any already-existing repository
#    and repository-ruleset resources into state before planning. This lets the
#    framework adopt a pre-existing fleet without trying to create resources that
#    already exist. Skipped under `plan_only` and detector mode, where nothing may
#    write state.
# 4. Runs terraform init/plan against the assembled tree. Ordinary and plan_only
#    runs use the canonical S3 backend; detector mode reads a copied, ETag-stripped
#    snapshot through a local backend. Apply only runs when explicitly requested
#    without plan_only or drift_issue.
#
# S3 layout convention
# --------------------
# Private files come from:
#
#   s3://<aws_s3_bucket>/<owner-lowercased>/<repo-name>/terraform/private/<*.yml|*.yaml>
#
# `<owner-lowercased>` = `${{ github.repository_owner }}` lowercased (so
# `NWarila` becomes `nwarila`, `the-hero-wars-guys` is unchanged, etc.).
# Consumers that need a different layout can override via the
# `private_repos_prefix` input.
#
# Caller pattern (in each runner repo):
#   name: Deploy GitHub Terraform
#   on:
#     push: { branches: [main], paths: ['terraform/**'] }
#     workflow_dispatch:
#   permissions:
#     contents: read
#     id-token: write
#   concurrency:
#     group: tf-${{ github.event.repository.name }}-${{ github.ref }}
#     cancel-in-progress: false
#   jobs:
#     deploy:
#       uses: nwarila-platform/github-terraform-framework/.github/workflows/reusable-terraform-deploy.yaml@<sha>
#       with:
#         github_owner: ${{ github.repository_owner }}
#         terraform_version: "1.15.4"
#       secrets:
#         aws_role_arn:    ${{ secrets.AWS_ROLE_TO_ASSUME }}
#         aws_region:      ${{ secrets.AWS_REGION }}
#         backend_bucket:  ${{ secrets.AWS_S3_BUCKET }}
#         gh_token:    ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}

on:
  workflow_call:
    inputs:
      github_owner:
        description: |
          GitHub org/user being managed by this deploy. Forwarded to Terraform
          as TF_VAR_github_owner.
        required: true
        type: string
      github_is_organization:
        description: |
          Whether github_owner is an organization. Forwarded to Terraform as
          TF_VAR_github_is_organization.
        required: false
        type: boolean
        default: false
      terraform_version:
        description: Exact Terraform version (e.g. "1.15.4").
        required: true
        type: string
      framework_ref:
        description: |
          Optional ref of github-terraform-framework to deploy. Defaults to
          this workflow's own commit (`github.sha` of the reusable).
        required: false
        type: string
        default: ""
      private_repos_prefix:
        description: |
          Override the S3 prefix from which private repo definition files are synced.
          Defaults to `<owner-lowercased>/<repo>/terraform/private`. The bucket is
          always `secrets.backend_bucket`. Override only for non-standard
          layouts.
        required: false
        type: string
        default: ""
      plan_only:
        description: |
          When true, run validate/plan READ-ONLY against the canonical S3 state and
          STOP before apply. Used by pull-request dry-runs.

          The state is READ but never written: `terraform plan` does not write state,
          the state-mutating adoption steps are skipped, and the plan runs with
          -lock=false so it neither takes the lock nor blocks a concurrent apply.
        required: false
        type: boolean
        default: false
      apply:
        description: |
          When true, apply the real-state Terraform plan. Leave false to produce
          and upload a real-state plan without changing managed resources.
          Ignored when plan_only or drift_issue is true.
        required: false
        type: boolean
        default: false
      drift_issue:
        description: |
          When true while plan_only and apply are false, detector mode copies the
          canonical state, strips stored ETags, and reads it through a local
          backend. Imports and the destroy guard are disabled in this mode. A
          non-empty plan opens (or updates) an issue in the CALLER repository,
          and an empty plan closes it. drift_issue always suppresses apply.

          Requires `issues: write` on the calling job. Ignored under plan_only;
          plan_only remains a canonical-state-backed read-only plan.
        required: false
        type: boolean
        default: false
    secrets:
      aws_role_arn:
        description: ARN of the AWS role to assume via OIDC.
        required: true
      aws_plan_role_arn:
        description: >-
          ARN of a READ-ONLY role, conditionally mandatory under plan_only and detector
          mode with no fallback to aws_role_arn in either mode. Needs s3:GetObject on the
          exact state key, plus prefix-scoped s3:ListBucket and s3:GetObject on the exact
          private-repo definitions prefix, and kms:Decrypt only when the object uses a
          customer-managed key. Must grant no S3 write action.
        required: false
      aws_region:
        description: AWS region for the S3 backend and any data plane calls.
        required: true
      backend_bucket:
        description: S3 bucket holding terraform state.
        required: true
      gh_token:
        description: GitHub token forwarded to Terraform as TF_VAR_github_token.
        required: true
      org_billing_email:
        description: Organization billing email forwarded only when provided.
        required: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required to assume the caller's cloud role via OIDC
      # Required by the drift_issue step. Granted unconditionally because Actions
      # has no conditional permissions and an explicit block here OVERRIDES what
      # the caller grants -- a caller setting `issues: write` does NOT reach this
      # job without this line, which is exactly how the first drift run failed.
      #
      # Splitting drift reporting into its own job with narrower permissions was
      # the alternative; it would require passing plan.json between jobs as an
      # artifact, which #85 deliberately stopped doing because the plan can
      # disclose private repo names. Scoped to the caller's own repo, and small
      # next to the org-admin PAT and cloud role this job already holds.
      issues: write # drift_issue opens/edits/closes an issue in the caller repo
    env:
      TF_VAR_github_owner: ${{ inputs.github_owner }}
      TF_VAR_github_is_organization: ${{ inputs.github_is_organization }}
      # gh_token (input name avoids the reserved `github_token`) is forwarded
      # to Terraform as TF_VAR_github_token so the framework's variable
      # surface stays unchanged.
      TF_VAR_github_token: ${{ secrets.gh_token }}
    steps:
      # plan_only reads canonical state, while detector mode copies canonical state
      # and strips ETags before reading it locally. Both modes require the read-only
      # aws_plan_role_arn and never fall back to the writer role.
      #
      # Fork pull requests receive no secrets and cannot assume any role, so this
      # step fails for them. That failure is NOT swallowed: a plan that cannot read
      # real state would be an unfaithful diff, and presenting one as authoritative
      # is the defect this whole path exists to remove.
      - name: Require read-only AWS role
        if: ${{ inputs.plan_only || (inputs.drift_issue && !inputs.plan_only && !inputs.apply) }}
        env:
          AWS_PLAN_ROLE_ARN: ${{ secrets.aws_plan_role_arn }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_PLAN_ROLE_ARN}" ]; then
            echo "::error::aws_plan_role_arn is required for plan-only and detector modes"
            exit 1
          fi

      - name: Initialize temporary AWS credentials (OIDC)
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: >-
            ${{ (inputs.plan_only || (inputs.drift_issue && !inputs.plan_only && !inputs.apply)) && secrets.aws_plan_role_arn || secrets.aws_role_arn }}
          aws-region: ${{ secrets.aws_region }}
          mask-aws-account-id: true

      - name: Check out runner (caller) repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: runner
          fetch-depth: 1
          persist-credentials: false

      - name: Check out github-terraform-framework
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nwarila-platform/github-terraform-framework
          ref: ${{ inputs.framework_ref || github.sha }}
          path: framework
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch private repo definitions from S3
        # MUST run under plan_only too, now that plan_only reads canonical state.
        # Those S3-only private repos are present in that state; if their definitions
        # were absent from the assembled config, Terraform would see managed resources
        # with no configuration and plan to DESTROY them. Skipping this step was safe
        # only while plan_only started from an empty state.
        #
        # This is why aws_plan_role_arn needs s3:ListBucket plus s3:GetObject on the
        # private-definitions prefix as well as the state key.
        env:
          PRIVATE_PREFIX_OVERRIDE: ${{ inputs.private_repos_prefix }}
          BUCKET: ${{ secrets.backend_bucket }}
        run: |
          set -euo pipefail
          if [ -n "${PRIVATE_PREFIX_OVERRIDE}" ]; then
            prefix="${PRIVATE_PREFIX_OVERRIDE}"
          else
            owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            repo_name="${GITHUB_REPOSITORY##*/}"
            prefix="${owner_lc}/${repo_name}/terraform/private"
          fi
          echo "S3 prefix: s3://${BUCKET}/${prefix}/"

          dest="runner/terraform/private"
          mkdir -p "${dest}"

          aws s3 sync "s3://${BUCKET}/${prefix}/" "${dest}/" --exclude "*" --include "*.yml" --include "*.yaml" --only-show-errors

          count="$(find "${dest}" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)"
          echo "private/ now contains ${count} file(s) total (S3-fetched + committed)"

      - name: Assemble framework workspace (overlay runner terraform inventory)
        run: |
          set -euo pipefail
          mkdir -p framework/terraform/repos/public framework/terraform/repos/private

          # The guards below MUST see dotfiles. `compgen -G "dir/*"` does not:
          # bash globbing skips leading-dot entries, so a directory holding only
          # `.github.yml` reads as empty, the copy is skipped, and the repository
          # silently ceases to be declared -- which Terraform then plans to
          # DELETE, along with its rulesets and branch default. That is not
          # hypothetical: it produced a 6-resource destroy plan including
          # `github_repository.repo[".github"]`, and nothing in the framework
          # sets prevent_destroy on repositories to stop it.
          #
          # `cp -a dir/.` on the next line already handles dotfiles correctly;
          # the glob guard defeated the very case that syntax exists for. `ls -A`
          # lists dotfiles while still excluding . and .. -- and cp of an empty
          # directory is harmless, so the guard is only an optimisation anyway.
          if [ -d runner/terraform/public ] && [ -n "$(ls -A runner/terraform/public)" ]; then
            cp -a runner/terraform/public/. framework/terraform/repos/public/
          fi
          if [ -d runner/terraform/private ] && [ -n "$(ls -A runner/terraform/private)" ]; then
            cp -a runner/terraform/private/. framework/terraform/repos/private/
          fi
          if [ -f runner/terraform/org.auto.tfvars ]; then
            cp runner/terraform/org.auto.tfvars framework/terraform/org.auto.tfvars
          fi
          echo "public:  $(find framework/terraform/repos/public  -maxdepth 1 -type f | wc -l) file(s)"
          echo "private: $(find framework/terraform/repos/private -maxdepth 1 -type f | wc -l) file(s)"

      - name: Export org billing email when provided
        env:
          ORG_BILLING_EMAIL: ${{ secrets.org_billing_email }}
        run: |
          if [ -n "${ORG_BILLING_EMAIL}" ]; then
            printf 'TF_VAR_org_billing_email=%s\n' "${ORG_BILLING_EMAIL}" >> "${GITHUB_ENV}"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform init (S3 backend)
        if: ${{ !(inputs.drift_issue && !inputs.plan_only && !inputs.apply) }}
        working-directory: framework/terraform
        env:
          BACKEND_BUCKET: ${{ secrets.backend_bucket }}
          AWS_REGION: ${{ secrets.aws_region }}
        run: |
          set -euo pipefail
          # Lowercase the owner to match the historical state-key convention
          # (NWarila -> nwarila). Same lowercasing convention the private-repo
          # S3 prefix uses.
          owner_lc="$(printf '%s' "${TF_VAR_github_owner}" | tr '[:upper:]' '[:lower:]')"
          repo_name="${GITHUB_REPOSITORY##*/}"
          terraform init \
            -backend-config="bucket=${BACKEND_BUCKET}" \
            -backend-config="encrypt=true" \
            -backend-config="key=${owner_lc}/${repo_name}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform init (ETag-stripped local backend)
        if: ${{ inputs.drift_issue && !inputs.plan_only && !inputs.apply }}
        working-directory: framework/terraform
        env:
          BACKEND_BUCKET: ${{ secrets.backend_bucket }}
        run: |
          set -euo pipefail
          # Match the canonical state-key convention used by the S3 init branch.
          owner_lc="$(printf '%s' "${TF_VAR_github_owner}" | tr '[:upper:]' '[:lower:]')"
          repo_name="${GITHUB_REPOSITORY##*/}"
          aws s3 cp \
            "s3://${BACKEND_BUCKET}/${owner_lc}/${repo_name}/terraform.tfstate" \
            canonical.tfstate \
            --only-show-errors
          jq '.resources[].instances[].attributes |= del(.etag)' \
            canonical.tfstate > stripped.tfstate
          if ! jq -e \
            'all(.resources[].instances[].attributes; type == "object" and (has("etag") | not))' \
            stripped.tfstate > /dev/null; then
            echo "::error::ETag-stripped state is invalid or still contains an etag"
            exit 1
          fi
          rm -f canonical.tfstate
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {
              path = "stripped.tfstate"
            }
          }
          EOF
          terraform init

      # READ-ONLY INVARIANT. plan_only reads the canonical S3 backend; detector mode
      # reads a copied, ETag-stripped snapshot through the local backend. Both are
      # faithful to canonical bindings and neither writes canonical state.
      # `terraform plan` never writes state; the only steps that do are the three
      # "Adopt ... into state" steps (`terraform import`) and `terraform apply`. Adoption is
      # gated OFF under plan_only and detector mode. plan_only runs with -lock=false so
      # it neither takes the canonical state lock nor blocks a concurrent apply.
      #
      # Defence in depth: both read-only modes require aws_plan_role_arn with no writer
      # fallback, so IAM denies canonical-state writes even if a future step forgets
      # this invariant.
      #
      # WHY THIS REPLACED THE OLD LOCAL-STATE PATH: plan_only used to init an empty local
      # backend and rely entirely on adoption to reconstruct reality. Adoption covers only
      # github_repository, github_repository_ruleset and github_organization_settings, but
      # the configuration declares thirteen resource types -- so every other type rendered
      # as a phantom "create" (89 creates for a 12-resource change on runner #63). That made
      # the plan gate structurally blind to changes in CODEOWNERS content, default branch,
      # environments and Actions permissions.
      - name: Adopt existing repositories into state
        if: ${{ !inputs.plan_only && !(inputs.drift_issue && !inputs.plan_only && !inputs.apply) }}
        working-directory: framework/terraform
        env:
          GITHUB_API_VERSION: "2022-11-28"
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/github-repository-names.txt
          import re
          from pathlib import Path

          names = set()
          for directory in (Path("repos/public"), Path("repos/private")):
              for path in sorted(directory.glob("*.yml")) + sorted(directory.glob("*.yaml")):
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if not line.strip() or line.lstrip().startswith("#") or line.startswith((" ", "\t")):
                          continue
                      match = re.match(r"^([A-Za-z0-9_.-]+):(?:\s*(?:#.*)?)?$", line)
                      if match:
                          names.add(match.group(1))

          for name in sorted(names):
              print(name)
          PY

          if [ ! -s /tmp/github-repository-names.txt ]; then
            echo "No repository definitions found; skipping state adoption."
            exit 0
          fi

          while IFS= read -r repo; do
            [ -z "${repo}" ] && continue

            address="github_repository.repo[\"${repo}\"]"
            if terraform state show "${address}" >/dev/null 2>&1; then
              echo "state already has ${repo}; skipping import"
              continue
            fi

            response="$(mktemp)"
            status="$(
              curl \
                --silent \
                --show-error \
                --output "${response}" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer ${TF_VAR_github_token}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
                "https://api.github.com/repos/${TF_VAR_github_owner}/${repo}" || true
            )"

            case "${status}" in
              200)
                echo "importing existing repository ${repo}"
                if ! terraform import -input=false "${address}" "${repo}"; then
                  cat "${response}"
                  rm -f "${response}"
                  exit 1
                fi
                ;;
              404)
                echo "remote repository ${repo} does not exist; Terraform will create it"
                ;;
              *)
                echo "GitHub API returned ${status} while checking ${repo}"
                cat "${response}"
                rm -f "${response}"
                exit 1
                ;;
            esac

            rm -f "${response}"
          done < /tmp/github-repository-names.txt

      - name: Adopt existing repository rulesets into state
        if: ${{ !inputs.plan_only && !(inputs.drift_issue && !inputs.plan_only && !inputs.apply) }}
        working-directory: framework/terraform
        env:
          GITHUB_API_VERSION: "2022-11-28"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import ast
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          owner = os.environ["TF_VAR_github_owner"]
          token = os.environ["TF_VAR_github_token"]
          api_version = os.environ["GITHUB_API_VERSION"]

          console = subprocess.run(
              ["terraform", "console", "-no-color"],
              input="jsonencode(local.branch_rulesets)\n",
              text=True,
              capture_output=True,
          )
          if console.returncode != 0:
              print(console.stdout, file=sys.stderr)
              print(console.stderr, file=sys.stderr)
              raise SystemExit(
                  f"terraform console failed while reading local.branch_rulesets "
                  f"(exit {console.returncode})"
              )

          payload = None
          for line in reversed(console.stdout.splitlines()):
              candidate = line.strip()
              if candidate.startswith('"') and candidate.endswith('"'):
                  payload = ast.literal_eval(candidate)
                  break

          if payload is None:
              print(console.stdout, file=sys.stderr)
              print(console.stderr, file=sys.stderr)
              raise SystemExit("could not read local.branch_rulesets from terraform console")

          desired = json.loads(payload)
          if not desired:
              print("No desired repository rulesets found; skipping ruleset adoption.")
              raise SystemExit(0)

          rulesets_cache = {}

          def remote_rulesets(repo):
              if repo in rulesets_cache:
                  return rulesets_cache[repo]

              url = f"https://api.github.com/repos/{owner}/{repo}/rulesets?per_page=100"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": api_version,
                  },
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      data = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      data = []
                  else:
                      raise

              rulesets_cache[repo] = data
              return data

          for key, ruleset in sorted(desired.items()):
              repo = ruleset["repository"]
              name = ruleset["name"]
              address = f'github_repository_ruleset.branch["{key}"]'

              state = subprocess.run(
                  ["terraform", "state", "show", address],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  text=True,
              )
              if state.returncode == 0:
                  print(f"state already has ruleset {key}; skipping import")
                  continue

              match = next(
                  (item for item in remote_rulesets(repo) if item.get("name") == name),
                  None,
              )
              if match is None:
                  print(f"remote ruleset {repo}/{name} does not exist; Terraform will create it")
                  continue

              import_id = f"{repo}:{match['id']}"
              print(f"importing existing ruleset {repo}/{name} as {key}")
              subprocess.run(
                  ["terraform", "import", "-input=false", address, import_id],
                  check=True,
              )
          PY

      - name: Adopt existing organization settings into state
        if: ${{ inputs.github_is_organization && !inputs.plan_only && !(inputs.drift_issue && !inputs.plan_only && !inputs.apply) }}
        working-directory: framework/terraform
        run: |
          set -euo pipefail
          [ -f org.auto.tfvars ] || { echo "no org.auto.tfvars; skipping org-settings adoption"; exit 0; }
          # Third gate: without the billing var the plan will fail V2 anyway — don't import pointlessly.
          [ -n "${TF_VAR_org_billing_email:-}" ] || { echo "org_billing_email not set; skipping org-settings adoption"; exit 0; }
          # Import-before-validate is safe: import only records live settings in the initialized backend and never changes GitHub.
          addr='github_organization_settings.org[0]'
          if terraform state show "$addr" >/dev/null 2>&1; then
            echo "state already has org settings; skipping import"; exit 0
          fi
          echo "importing existing organization settings for ${TF_VAR_github_owner}"
          terraform import -input=false "$addr" "${TF_VAR_github_owner}"

      - name: Terraform validate
        working-directory: framework/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: framework/terraform
        env:
          PLAN_ONLY: ${{ inputs.plan_only }}
        run: |
          set -euo pipefail
          # Suppress the human-readable plan RENDER from the (public) Actions log
          # — it can disclose private repo names + nonsensitive attribute values.
          # Errors go to stderr and remain visible; the binary plan is in tfplan.
          # plan_only reads canonical state but must never take its lock: a PR plan
          # has no business blocking an apply, and a read-only plan role cannot write
          # a lock anyway. Real-state runs keep locking (they may be followed by apply).
          if [ "${PLAN_ONLY}" = "true" ]; then
            lock_args=(-lock=false)
          else
            lock_args=(-lock-timeout=10m)
          fi
          terraform plan -input=false "${lock_args[@]}" -out=tfplan > /dev/null
          # Plan JSON stays LOCAL to the ephemeral runner (never uploaded, never
          # echoed to a public surface); the sanitized summary is derived from it.
          # (sensitive TF_VARs already render as "(sensitive value)".)
          terraform show -json tfplan > plan.json

      - name: Guard repository destroys
        if: ${{ !(inputs.drift_issue && !inputs.plan_only && !inputs.apply) }}
        working-directory: framework/terraform
        run: |
          set -euo pipefail
          # A Terraform "delete" of github_repository is NOT necessarily a
          # deletion. `archive_on_destroy` defaults to true, and the provider's
          # delete path then archives the repository instead - so removing a
          # definition retires it, which is the intended behaviour. The plan
          # shows `delete` either way, so the plan alone cannot tell you which
          # you are about to do. This step can, because it reads the before-state.
          #
          # Refused:
          #   archive_on_destroy = false  -> a genuine, irreversible deletion.
          #   repository not already archived -> archiving as a SIDE EFFECT of a
          #     definition going missing. That is the signature of a bug, not a
          #     retirement: a dotfile-blind glob dropped a definitions file, the
          #     repository stopped being declared, and the plan proposed to
          #     archive a live public org-profile repository.
          #
          # Allowed:
          #   already-archived repository leaving the config -> the provider
          #   no-ops and state simply forgets it. This is the last step of a
          #   deliberate retirement.
          python3 - <<'PY'
          import json, sys

          with open("plan.json", encoding="utf-8") as fh:
              plan = json.load(fh)

          deletions, premature, retiring, other = [], [], [], []
          for rc in plan.get("resource_changes", []):
              if "delete" not in rc.get("change", {}).get("actions", []):
                  continue
              addr = rc.get("address", "")
              if rc.get("type") != "github_repository":
                  other.append(addr)
                  continue
              before = rc.get("change", {}).get("before") or {}
              if not before.get("archive_on_destroy", True):
                  deletions.append(addr)
              elif not before.get("archived", False):
                  premature.append(addr)
              else:
                  retiring.append(addr)

          if other:
              # Dependent resources legitimately churn, but a destroy should
              # never scroll past unread.
              print(f"note: {len(other)} non-repository resource(s) will be destroyed:")
              for a in sorted(other)[:20]:
                  print(f"  {a}")
              print()

          for addr in sorted(retiring):
              print(f"ok: {addr} is already archived; leaving management is a no-op on GitHub.")

          if deletions:
              print("::error::REFUSING TO DELETE REPOSITORIES.")
              for addr in sorted(deletions):
                  print(f"::error::  {addr}  (archive_on_destroy = false)")
              print()
              print("Terraform does not delete repositories here. Remove")
              print("`archive_on_destroy: false` from the repository's YAML; retirement is")
              print("`archived: true`, then a deliberate delete in the GitHub UI.")

          if premature:
              print("::error::REFUSING TO ARCHIVE REPOSITORIES THAT WERE NOT ARCHIVED FIRST.")
              for addr in sorted(premature):
                  print(f"::error::  {addr}")
              print()
              print("These would be archived only because their definition is no longer")
              print("being read. If that was not intended, check the assembly step's file")
              print("counts - a definition silently going missing is the known cause of")
              print("this plan shape, and archiving a live repository breaks its CI.")
              print()
              print("To retire a repository deliberately: set `archived: true` and apply,")
              print("THEN remove its YAML. This step allows that second removal.")

          if deletions or premature:
              sys.exit(1)

          if not retiring:
              print("No repository destroys in this plan.")
          PY


      # Publishes on EVERY run, not just plan_only. The plan render is suppressed
      # from the (public) Actions log, so without this a workflow_dispatch plan
      # (apply=false) — the pre-apply review path — produced NO reviewable output
      # at all. The summary is value-free (counts + address -> action), so it is
      # safe to publish on real-state and apply runs too.
      - name: Publish sanitized plan summary to job summary
        working-directory: framework/terraform
        run: |
          set -euo pipefail
          # Emit an ALLOWLISTED summary (per-action counts + address -> action)
          # derived from the plan JSON. No attribute VALUES are printed, so the
          # public job summary cannot leak config/secret values. Resource
          # addresses (which include repo names) are shown so the diff is still
          # reviewable; deeper review uses a real-state plan run out-of-band.
          #
          # `tee` sends the summary to BOTH the job summary and stdout. The job
          # summary is human-readable but is not exposed by any REST endpoint, so
          # a summary written only there cannot be asserted programmatically --
          # meaning a reviewer's "this plan changes only what I intended" is an
          # eyeball claim rather than a check. The job log IS retrievable, so
          # duplicating there makes the plan machine-assertable by a gate.
          #
          # This adds no disclosure: job logs and job summaries have identical
          # visibility, and the content is the same allowlisted, value-free text.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          with open("plan.json", encoding="utf-8") as fh:
              plan = json.load(fh)
          rows = []
          tally = Counter()
          for rc in plan.get("resource_changes", []):
              actions = rc.get("change", {}).get("actions", [])
              act = "-".join(actions)
              if act in ("no-op", "read"):
                  continue
              tally[act] += 1
              rows.append((rc.get("address", "?"), act))
          print("### Terraform plan — sanitized")
          print()
          if not rows:
              print("No changes. Infrastructure matches the configuration.")
          else:
              print("| count | action |")
              print("|---|---|")
              for act, n in sorted(tally.items(), key=lambda kv: -kv[1]):
                  print(f"| {n} | `{act}` |")
              print()
              print("| resource | action |")
              print("|---|---|")
              for addr, act in sorted(rows):
                  print(f"| `{addr}` | `{act}` |")
              print()
              print("_Values omitted by design (public repo). Run a real-state plan out-of-band for full detail._")
          PY

      - name: Report drift as an issue
        # Detector mode reads a copied, ETag-stripped canonical snapshot through
        # a local backend. Issue lifecycle is keyed only to actionable
        # resource_changes; refresh-only resource_drift entries are not reports.
        if: ${{ inputs.drift_issue && !inputs.plan_only && !inputs.apply }}
        working-directory: framework/terraform
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Reuse the same allowlisted projection as the job summary: resource
          # address and action only, never attribute values.
          python3 - > drift.md <<'PY'
          import json
          from collections import Counter
          with open("plan.json", encoding="utf-8") as fh:
              plan = json.load(fh)
          rows, tally = [], Counter()
          classes = Counter()
          for rc in plan.get("resource_changes", []):
              actions = rc.get("change", {}).get("actions", [])
              act = "-".join(actions)
              if act in ("no-op", "read"):
                  continue
              classification = (
                  "INDETERMINATE / state-binding-missing"
                  if actions == ["create"]
                  else "DRIFT / live-mismatch"
              )
              tally[act] += 1
              classes[classification] += 1
              rows.append((rc.get("address", "?"), classification, act))
          if rows:
              if classes["DRIFT / live-mismatch"]:
                  print("DRIFT / live-mismatch: the live configuration no longer matches what Terraform declares.")
              if classes["INDETERMINATE / state-binding-missing"]:
                  print("INDETERMINATE / state-binding-missing: Terraform has a desired resource with no canonical state binding; its live status is unproven.")
              print()
              print("| count | action |")
              print("|---|---|")
              for act, n in sorted(tally.items(), key=lambda kv: -kv[1]):
                  print(f"| {n} | `{act}` |")
              print()
              print("| resource | class | action |")
              print("|---|---|---|")
              for addr, classification, act in sorted(rows):
                  print(f"| `{addr}` | {classification} | `{act}` |")
              print()
              if classes["DRIFT / live-mismatch"]:
                  print("A `delete`, `update`, or replacement here means live GitHub no longer")
                  print("matches the declared configuration. Re-applying restores the declaration.")
              if classes["INDETERMINATE / state-binding-missing"]:
                  print("A `create` here is a state-binding gap, not proof that the live object is absent.")
          PY

          TITLE="Terraform drift or state-binding gap detected"
          EXISTING="$(gh issue list --repo "$REPO" --state open --label terraform-drift \
                        --json number --jq '.[0].number // empty')"

          if [ ! -s drift.md ]; then
            # Recovery is a signal too: without it the issue outlives the drift and
            # the next genuine alert arrives on an already-open thread nobody reads.
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" \
                --body "Resolved — the plan is empty again as of [this run]($RUN_URL)."
              gh issue close "$EXISTING" --repo "$REPO"
              echo "drift resolved; closed #$EXISTING"
            else
              echo "no drift"
            fi
            exit 0
          fi

          printf '\n\nDetected by [this run](%s).\n' "$RUN_URL" >> drift.md

          # Keep the canonical label truthful even when an existing issue is edited.
          gh label create terraform-drift --repo "$REPO" \
            --description "Non-empty Terraform plan or missing state binding" \
            --color B60205 --force

          if [ -n "$EXISTING" ]; then
            # Update in place rather than commenting nightly: an issue that grows a
            # comment every night gets muted, and a muted alert is not an alert.
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file drift.md
            echo "drift still present; updated #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label terraform-drift --body-file drift.md
            echo "drift detected; issue opened"
          fi

      - name: Terraform apply
        if: ${{ inputs.apply && !inputs.plan_only && !inputs.drift_issue }}
        working-directory: framework/terraform
        run: terraform apply -auto-approve tfplan

      - name: Cleanup workspace
        if: always()
        run: |
          rm -f framework/terraform/tfplan
          rm -rf runner framework
