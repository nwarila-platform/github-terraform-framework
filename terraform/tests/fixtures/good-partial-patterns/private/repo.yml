good-partial-patterns-repo:
  description: "pattern blocks with only the 'pattern' field set — exercises the S4 try() fixes for negate/operator/name defaults"
  visibility: private
  rules:
    - name: "branch pattern rule"
      target: branch
      enforcement: active
      conditions:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
      rules:
        branch_name_pattern:
          pattern: "^release/.*$"
        commit_message_pattern:
          pattern: "^(feat|fix|chore)"
