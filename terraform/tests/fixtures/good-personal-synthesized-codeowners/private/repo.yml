good-personal-synthesized-repo:
  description: "personal-mode repo with require_code_owner_review but no explicit codeowners — framework synthesizes '* @<owner>'"
  visibility: private
  rules:
    - name: "PR gate"
      target: branch
      enforcement: active
      conditions:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
      rules:
        pull_request:
          allowed_merge_methods:
            - squash
          require_code_owner_review: true
          required_approving_review_count: 1
